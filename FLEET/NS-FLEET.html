      var st = pmsStandingInfo(j).text;
      return '<tr><td>'+esc(j.jobNo||"")+'</td><td>'+esc(vesselName(j.vessel))+'</td><td>'+esc(j.component||"")+'</td><td>'+esc(j.job||"")+'</td>'+
             '<td>'+esc(j.basis||"")+'</td><td>'+esc(dmy(j.lastDone))+'</td><td>'+esc(dmy(j.dueDate))+'</td><td>'+esc(j.criticality||"")+'</td><td>'+esc(st)+'</td></tr>';
    }).join("");
    Print.show("PLANNED MAINTENANCE STATUS","All vessels",'<table class="pgrid"><thead><tr><th>Job no.</th><th>Vessel</th><th>Component</th><th>Job</th><th>Basis</th><th>Last done</th><th>Next due</th><th>Criticality</th><th>Standing</th></tr></thead><tbody>'+rows+'</tbody></table>',true);
  },
  defects:function(){
    var ds=(DB.defects||[]).filter(function(d){return d.status!=="Closed";});
    if(!ds.length) return UI.alert("There are no open defects.");
    var rows=sortBy(ds,"reported",true).map(function(d){
      return '<tr><td>'+esc(d.refNo||"")+'</td><td>'+esc(vesselName(d.vessel))+'</td><td>'+esc(d.equipment||"")+'</td><td>'+esc(d.description||"")+'</td>'+
             '<td>'+esc(d.severity||"")+'</td><td>'+esc(dmy(d.reported))+'</td><td>'+esc(dmy(d.targetDate))+'</td><td>'+esc(d.status||"")+'</td></tr>';
    }).join("");
    Print.show("OPEN DEFECTS AND REPAIRS","All vessels",'<table class="pgrid"><thead><tr><th>Ref.</th><th>Vessel</th><th>Equipment</th><th>Defect</th><th>Severity</th><th>Reported</th><th>Target</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>',true);
  },
  crewPicker:function(){
    if(!DB.vessels.length) return UI.alert("Add a vessel first.");
    UI.open("Crew list","<div class='f'><label>Vessel</label><select id='clv'>"+vesselOpts().map(function(o){return '<option value="'+o.v+'">'+esc(o.l)+'</option>';}).join("")+"</select></div>",
      '<button class="btn g" onclick="UI.close()">Cancel</button><button class="btn o" onclick="var v=document.getElementById(\'clv\').value;UI.close();Views.printCrewList(v)">Build crew list</button>',"sm");
  },
  crewDocs:function(){
    var cs=(DB.crew||[]).filter(function(c){return c.status!=="Separated";});
    if(!cs.length) return UI.alert("No crew recorded yet.");
    cs.sort(function(a,b){ return (vesselName(a.vessel)+a.rank).localeCompare(vesselName(b.vessel)+b.rank); });
    var rows=cs.map(function(c){
      function cell(d){ if(!d) return '<td></td>'; return '<td'+(days(d)<0?' style="background:#f7d7d4"':(days(d)<=45?' style="background:#fbf0d5"':''))+'>'+dmy(d)+'</td>'; }
      return '<tr><td>'+esc(c.ccn||"")+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.rank||"")+'</td><td>'+esc(vesselName(c.vessel))+'</td>'+
             cell(c.contractEnd)+cell(c.sirbExp)+cell(c.licenseExp)+cell(c.medicalExp)+cell(c.sidExp)+'</tr>';
    }).join("");
    Print.show("CREW DOCUMENT VALIDITY","All vessels — shaded cells are expired or fall due within 45 days",
      '<table class="pgrid"><thead><tr><th>Crew no.</th><th>Name</th><th>Rank</th><th>Vessel</th><th>Contract end</th><th>SIRB</th><th>Licence / COP</th><th>Medical</th><th>MARINA ID</th></tr></thead><tbody>'+rows+'</tbody></table>',true);
  },
  findings:function(){
    var f=(DB.findings||[]).filter(function(x){return x.status!=="Verified and closed";});
    if(!f.length) return UI.alert("There are no open findings.");
    var rows=sortBy(f,"targetDate").map(function(x){
      var late=x.targetDate&&days(x.targetDate)<0;
      return '<tr><td>'+esc(x.refNo||"")+'</td><td>'+esc(x.vessel?vesselName(x.vessel):"Office")+'</td><td>'+esc(x.category||"")+'</td>'+
        '<td>'+esc(x.clause||"")+'</td><td>'+esc(x.description||"")+'</td><td>'+esc(x.correctiveAction||"")+'</td>'+
        '<td>'+esc(x.responsible||"")+'</td><td>'+esc(dmy(x.targetDate))+(late?" (OVERDUE)":"")+'</td><td>'+esc(x.status||"")+'</td></tr>';
    }).join("");
    Print.show("OPEN FINDINGS AND CORRECTIVE ACTIONS","All vessels and office",
      '<table class="pgrid"><thead><tr><th>No.</th><th>Scope</th><th>Category</th><th>Reference</th><th>Finding</th><th>Corrective action</th><th>Responsible</th><th>Target</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>',true,true);
  },

  procurement:function(){
    var rs=sortBy(DB.requisitions||[],"date",true);
    if(!rs.length) return UI.alert("No requisitions recorded yet.");
    var rows=rs.map(function(r){
      return '<tr><td>'+esc(r.reqNo||"")+'</td><td>'+esc(dmy(r.date))+'</td><td>'+esc(vesselName(r.vessel))+'</td><td>'+esc(r.category||"")+'</td>'+
             '<td>'+esc(r.item||"")+'</td><td style="text-align:right">'+esc(r.quantity||"")+' '+esc(r.unit||"")+'</td><td>'+esc(r.supplier||"")+'</td>'+
             '<td style="text-align:right">'+peso(num(r.actualCost)||num(r.estCost))+'</td><td>'+esc(r.status||"")+'</td></tr>';
    }).join("");
    var total=rs.reduce(function(s,r){return s+(num(r.actualCost)||num(r.estCost));},0);
    Print.show("PROCUREMENT STATUS REPORT","All vessels",
      '<table class="pgrid"><thead><tr><th>Req. no.</th><th>Date</th><th>Vessel</th><th>Category</th><th>Item</th><th>Qty</th><th>Supplier</th><th>Value</th><th>Status</th></tr></thead><tbody>'+rows+
      '<tr><td colspan="7" style="text-align:right"><b>Total</b></td><td style="text-align:right"><b>'+peso(total)+'</b></td><td></td></tr></tbody></table>',true);
  },
  safety:function(){
    var from=new Date(Date.now()-90*86400000).toISOString().slice(0,10);
    var dr=(DB.drills||[]).filter(function(d){return d.date>=from;});
    var inc=(DB.incidents||[]).filter(function(i){return i.date>=from;});
    var au=(DB.audits||[]).filter(function(a){return a.date>=from;});
    var byType={}; inc.forEach(function(i){ byType[i.type||"Other"]=(byType[i.type||"Other"]||0)+1; });
    var h='<table class="pgrid" style="margin-bottom:10px"><tbody>'+
      '<tr><td style="width:40%"><b>Drills and training conducted</b></td><td>'+dr.length+'</td></tr>'+
      '<tr><td><b>Safety reports raised</b></td><td>'+inc.length+'</td></tr>'+
      '<tr><td><b>Reports still open</b></td><td>'+inc.filter(function(i){return i.status!=="Closed";}).length+'</td></tr>'+
      '<tr><td><b>Audits and inspections</b></td><td>'+au.length+'</td></tr>'+
      '<tr><td><b>Non-conformities raised</b></td><td>'+au.reduce(function(s,a){return s+num(a.ncr);},0)+'</td></tr>'+
      '<tr><td><b>Findings logged and tracked</b></td><td>'+(DB.findings||[]).length+'</td></tr>'+
      '<tr><td><b>Findings still open</b></td><td>'+(DB.findings||[]).filter(function(f){return f.status!=="Verified and closed";}).length+'</td></tr>'+
      '<tr><td><b>Findings closed within target date</b></td><td>'+(DB.findings||[]).filter(function(f){return f.status==="Verified and closed"&&f.closedDate&&f.targetDate&&f.closedDate<=f.targetDate;}).length+'</td></tr>'+
      '<tr><td><b>Drills overdue at date of report</b></td><td>'+DrillPlan.gaps().length+'</td></tr></tbody></table>';
    h+='<table class="pgrid"><thead><tr><th>Report type</th><th>Count in period</th></tr></thead><tbody>'+
       (Object.keys(byType).length? Object.keys(byType).map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+byType[k]+'</td></tr>';}).join("") : '<tr><td colspan="2">No reports raised in the period.</td></tr>')+
       '</tbody></table>';
    Print.show("SAFETY PERFORMANCE SUMMARY","Period "+dmy(from)+" to "+dmy(today()),h,false,true);
  }
};

      '</div>'+
      '<div class="pt">'+esc(title)+'</div>'+

      '<div style="background:#fff;border:1px solid #d7e1e6;padding:14px;border-radius:6px;overflow-x:auto">'+full+'</div>'+
      '<p style="font-size:12.5px;color:#5d7480;margin:10px 0 0">Press <b>Print</b> below to send this to the printer or save it as a PDF. On iPad, choose <b>Share</b> then <b>Save to Files</b> from the print dialog.</p>',
      '<button class="btn g" onclick="UI.close()">Close</button><button class="btn o" onclick="window.print()">Print</button>',"lg");
  }
};

function seed(db){
  var fleet=[
    {name:"MTUG NAVI 01", type:"Tugboat", mgmt:"Owned", engineHP:720, flag:"Philippines", tradeArea:"Philippine coastwise"},
    {name:"LCT OCEAN 1", type:"Landing Craft Tank (LCT)", mgmt:"Full Management", flag:"Philippines", tradeArea:"Philippine coastwise"},
    {name:"STELLA MARIS 1", type:"Landing Craft Tank (LCT)", mgmt:"Full Management", flag:"Philippines", tradeArea:"Philippine coastwise"},
    {name:"MV KAMILA", type:"Landing Craft Tank (LCT)", mgmt:"Full Management", owner:"Oriental Transmarine Inc.", flag:"Philippines", tradeArea:"Philippine coastwise"},
    {name:"MB AMC SPEED", type:"Speedboat / Motor Banca", mgmt:"Time Chartered-in", flag:"Philippines", tradeArea:"Philippine coastwise"}
  ];
  fleet.forEach(function(f){
    f.id=uid(); f.created=new Date().toISOString();
    db.vessels.push(f);
  });
  return db;
}

(function(){
  var _r=App.render;
  App.render=function(){ _r.call(App); App.refreshAlertBadge(); decorateKpis(); };

/* KPI tiles written directly as HTML get the same icon treatment as kpi() */
function decorateKpis(){
  var ks=document.querySelectorAll("#view .kpi:not(.has-ic)");
  for(var i=0;i<ks.length;i++){
    var k=ks[i], l=k.querySelector(".l");
    var ic=kpiIcon(l?l.textContent:"", k.className);
    k.innerHTML='<span class="kic">'+ficon(ic)+'</span><div class="kb">'+k.innerHTML+'</div>';
    k.classList.add("has-ic");
  }
}
