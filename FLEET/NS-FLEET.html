  function toLogin(){ location.replace("index.html"); }
  try{ fleetAuth = window.supabase.createClient(FLEET_SUPABASE_URL, FLEET_SUPABASE_ANON_KEY); }
  catch(e){ toLogin(); return; }
  var domReady = new Promise(function(r){
    if(document.readyState !== "loading") r(); else document.addEventListener("DOMContentLoaded", r);
  });
  fleetAuth.auth.getSession().then(async function(res){
    var session = res.data && res.data.session;
    if(!session){ toLogin(); return; }
    await domReady;
    document.documentElement.style.visibility = "";
    var el = document.getElementById("fleetUser");
    if(el) el.textContent = session.user.email;
    startApp(session.user);
  }).catch(toLogin);

  function escHtml(s){ return String(s || "").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function showLoading(html){
    var ov = document.getElementById("fleetLoading");
    if(!ov){
      ov = document.createElement("div");
      ov.id = "fleetLoading";
      ov.style.cssText = "position:fixed;inset:0;z-index:9999;background:#EDF2F3;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#0B3D56;text-align:center;";
      document.body.appendChild(ov);
    }
    ov.innerHTML = '<div style="max-width:520px;font-size:15px;line-height:1.5;">' + html + '</div>';
    return ov;
  }
  var btnCss = 'border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;margin:4px;';

  async function startApp(user){
    var ov = showLoading("<b>Loading NS FLEET…</b>");
    try{
      await FleetCloud.boot(fleetAuth, user, function(msg){ showLoading("<b>" + escHtml(msg) + "</b>"); });
    }catch(e){
      console.error(e);
      if(e && e.code === "NOT_STAFF"){
        showLoading(
          '<div style="font-size:18px;font-weight:800;margin-bottom:8px;">No access to NS FLEET</div>' +
          '<p>You are signed in as <b>' + escHtml(user.email) + '</b>, but this account is not on the fleet staff list. ' +
          'Ask your admin to add your email to <b>fleet_staff</b> in the NS FLEET Supabase project.</p>' +
          '<button id="fleetOut" style="' + btnCss + 'background:#0B3D56;color:#fff;">Sign out</button>');
        document.getElementById("fleetOut").onclick = function(){ fleetSignOut(); };
        return;
      }
      var msg = (e && e.message) || String(e);
      var missing = /fleet_records|fleet_settings|fleet_is_staff|schema cache|does not exist|could not find the function|bucket not found/i.test(msg);
      showLoading(
        '<div style="font-size:18px;font-weight:800;margin-bottom:8px;">Couldn\'t load NS FLEET</div>' +
        (missing
          ? '<p>The database for NS FLEET hasn\'t been set up yet. Open the NS FLEET project in Supabase → <b>SQL Editor</b>, paste in <b>supabase-fleet-setup.sql</b>, click <b>Run</b>, then retry.</p>'
          : '<p>Check your internet connection and try again.</p>') +
        '<p style="font-size:12px;color:#5F7C84;">' + escHtml(msg) + '</p>' +
        '<button id="fleetRetry" style="' + btnCss + 'background:#0E6B76;color:#fff;">Retry</button>' +
        '<button id="fleetOut2" style="' + btnCss + 'background:#fff;color:#0B3D56;border:1px solid #D5E0E2;">Sign out</button>');
      document.getElementById("fleetRetry").onclick = function(){ startApp(user); };
      document.getElementById("fleetOut2").onclick = function(){ fleetSignOut(); };
      return;
    }
    ov.remove();
    var app = document.createElement("script");
    app.textContent = document.getElementById("fleetApp").textContent;
    document.body.appendChild(app);
    // push anything not yet in Supabase (e.g. data brought over from this browser); a no-op otherwise
    if(window.FleetCloud) FleetCloud.saveNow();
    startIdleWatch();
  }

  function startIdleWatch(){
    var last = Date.now();
    ["click","keydown","mousemove","touchstart","scroll","wheel"].forEach(function(ev){
      document.addEventListener(ev, function(){ last = Date.now(); }, {passive:true, capture:true});
    });
    setInterval(function(){ if(Date.now() - last > IDLE_MS) fleetSignOut("idle"); }, 60000);
  }
})();

/* Waits (up to 10 s) for unsaved changes to reach the database, then signs out. */
async function fleetSignOut(reason){
  for(var i = 0; i < 20 && window.FleetCloud && FleetCloud.isBusy(); i++){
    await new Promise(function(r){ setTimeout(r, 500); });
  }
  try{ if(fleetAuth) await fleetAuth.auth.signOut(); }catch(e){}
  location.replace("index.html?out=" + (reason === "idle" ? "idle" : "1"));
}
</script>

<script type="text/plain" id="fleetApp">
"use strict";
/* =====================================================================
   NS FLEET — NAVI SHIPPING FLEET MANAGEMENT SYSTEM
   Data is saved to Supabase through fleet-sync.js (see supabase-fleet-setup.sql).
   ===================================================================== */

/* ---------------- Storage (dual: window.storage -> localStorage) ------ */
var KEY = "NSFLEET_DB_V1";
var DB = null;

function blankDB(){
  return {
    meta:{created:new Date().toISOString(), counters:{}},
    vessels:[], dailyreports:[],
    crew:[], crewchange:[],
    components:[], pmsjobs:[], defects:[],
    requisitions:[],
    drills:[], incidents:[], audits:[], findings:[],
    certificates:[],
    voyages:[],
    bunkers:[], consumption:[], engines:[], fuellog:[]
  };
}
function load(){
  var raw=null;
  try{ raw = fleetStore.getItem(KEY); }catch(e){ raw=null; }
  if(!raw){ DB = seed(blankDB()); save(); return; }
  try{
    DB = JSON.parse(raw);
    var b=blankDB();
    for(var k in b){ if(!DB[k]) DB[k]=b[k]; }
    if(!DB.meta) DB.meta=b.meta;
    if(!DB.meta.counters) DB.meta.counters={};
    migrateFuel(); migrateEngineNames(); migrateTimes();
  }catch(e){ DB = seed(blankDB()); }
}
function save(){
  try{ fleetStore.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ UI.toast("Could not save. Check your connection."); }
}
/* engines encoded before the port/starboard naming are renamed in place */
function migrateEngineNames(){
  var map={"Main engine No.1":"Main engine (P)","Main engine No.2":"Main engine (S)",
           "Auxiliary engine No.1":"Auxiliary engine No.1 (P)","Auxiliary engine No.2":"Auxiliary engine No.2 (S)",
           "Auxiliary engine No.3":"Auxiliary engine No.3 (P)","Auxiliary engine No.4":"Auxiliary engine No.4 (S)"};
  (DB.engines||[]).forEach(function(e){ if(map[e.unit]) e.unit=map[e.unit]; });
  (DB.fuellog||[]).forEach(function(f){ (f.rows||[]).forEach(function(r){ if(map[r.unit]) r.unit=map[r.unit]; }); });
}

/* older flat consumption rows are carried into the per-engine log */
function migrateFuel(){
  if(!DB.consumption||!DB.consumption.length) return;
  DB.consumption.forEach(function(c){
    DB.fuellog.push({id:c.id||uid(),refNo:c.refNo||"FL-LEGACY",date:c.date,vessel:c.vessel,voyage:c.voyage||"",
      rows:[{unit:"Main engine (P)",seaHrs:c.runHours||0,portHrs:0,used:c.fuelUsed||0}],
      robEnd:c.robEnd||"",remarks:(c.remarks||"")+" (carried over from the earlier consumption log)",created:new Date().toISOString()});
  });
  DB.consumption=[];
}
/* military time: accepts 1200, 12:00, 930, 9 — returns "1200" or "" if not valid */
function hhmm(v){
  var d=String(v==null?"":v).replace(/[^0-9]/g,"");
  if(!d) return "";
  if(d.length===1||d.length===2) d=d.padStart(2,"0")+"00";
  else if(d.length===3) d="0"+d;
  else if(d.length>4) d=d.slice(0,4);
  var h=parseInt(d.slice(0,2),10), m=parseInt(d.slice(2),10);
  if(isNaN(h)||isNaN(m)||h>23||m>59) return "";
  return String(h).padStart(2,"0")+String(m).padStart(2,"0");
}
/* times stored with a colon before the change to military format */
function migrateTimes(){
  (DB.fuellog||[]).forEach(function(r){ if(r.time) r.time=hhmm(r.time); });
  (DB.bunkers||[]).forEach(function(b){ if(b.time) b.time=hhmm(b.time); });
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function seq(name, prefix, pad){
  var c = DB.meta.counters; c[name] = (c[name]||0)+1;
  return prefix + String(c[name]).padStart(pad||4,"0");
}

/* ---------------- Small helpers -------------------------------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function dmy(s){ if(!s) return ""; var p=String(s).slice(0,10).split("-"); if(p.length!==3) return s; return p[2]+"/"+p[1]+"/"+p[0]; }
function days(from,to){ if(!from) return null; var a=new Date((to||today())+"T00:00:00"), b=new Date(String(from).slice(0,10)+"T00:00:00"); return Math.round((b-a)/86400000); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function peso(v){ return "\u20B1"+num(v).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function qty(v,d){ return num(v).toLocaleString("en-PH",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function byId(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
function vesselName(id){ var v=byId(DB.vessels,id); return v?v.name:""; }
function vesselOpts(){ return DB.vessels.slice().sort(function(a,b){return (a.name||"").localeCompare(b.name||"");}).map(function(v){return {v:v.id,l:v.name};}); }
function sortBy(arr,key,desc){ return arr.slice().sort(function(a,b){ var x=a[key]||"", y=b[key]||""; if(x<y) return desc?1:-1; if(x>y) return desc?-1:1; return 0; }); }
function auditLabel(id){
  var a=byId(DB.audits,id); if(!a) return "";
  return (a.refNo||"")+" · "+(a.type||"")+" · "+dmy(a.date);
}
function auditOpts(){
  return sortBy(DB.audits||[],"date",true).map(function(a){ return {v:a.id,l:auditLabel(a.id)}; });
}
function pill(text,kind){ return '<span class="pill p-'+kind+'">'+esc(text)+'</span>'; }

  toast:function(msg){

  confirm:function(msg){

      document.getElementById("cNo").onclick=function(){UI.close();res(false);};

  pickFile:function(accept, cb){

function expiryPill(dateStr, warnDays, badLabel, warnLabel){
  if(!dateStr) return pill("Not set","neu");
  var d=days(dateStr);
  if(d<0) return pill((badLabel||"Expired")+" "+Math.abs(d)+"d","bad");
  if(d<=(warnDays||30)) return pill((warnLabel||"Expires")+" in "+d+"d","warn");
  return pill(d+" days left","ok");
}

/* Calendar / Running hours / Both standing for a planned maintenance job.
   Running hours has no live "current hours" reading in the PMS record itself, so it can only ever
   state the scheduled target (Next due at running hours) — never a remaining/overdue countdown. */
function pmsUnitText(n,singular,plural){ return n+" "+(n===1?singular:plural); }
function pmsStandingInfo(r){
  if(r.status==="Completed") return {text:"Completed",kind:"ok"};
  if(r.status==="Postponed (approved)") return {text:"Postponed",kind:"info"};
  var basis=r.basis||"Calendar";
  var calDays = r.dueDate? days(r.dueDate) : null;
  var hasDueHours = r.dueHours!==""&&r.dueHours!=null;
  var hrsTarget = hasDueHours? ("Due at "+qty(num(r.dueHours),0)+" hrs") : "Not set";

  /* Calendar-only jobs must never show a running-hours figure, and vice versa — the basis alone decides what's shown */
  if(basis==="Calendar"){
    if(calDays===null) return {text:"Not set",kind:"neu"};
    if(calDays===0) return {text:"DUE \u2014 Calendar",kind:"bad"};
    if(calDays<0) return {text:"OVERDUE \u2014 "+pmsUnitText(Math.abs(calDays),"day","days"),kind:"bad"};
    return {text:pmsUnitText(calDays,"day","days")+" left",kind:calDays<=14?"warn":"ok"};
  }
  if(basis==="Running hours"){
    if(!hasDueHours) return {text:"Not set",kind:"neu"};
    return {text:hrsTarget,kind:"info"};
  }
  /* Both — the calendar side keeps its live countdown; the running-hours side is just the scheduled target */
  if(calDays===null && !hasDueHours) return {text:"Not set",kind:"neu"};
  if(calDays===0) return {text:"DUE \u2014 Calendar / "+hrsTarget,kind:"bad"};
  if(calDays!==null && calDays<0) return {text:"OVERDUE \u2014 "+pmsUnitText(Math.abs(calDays),"day","days")+" / "+hrsTarget,kind:"bad"};
  var calText = calDays===null? "Not set" : pmsUnitText(calDays,"day","days")+" left";
  var kind = calDays===null? "info" : (calDays<=14?"warn":"ok");
  return {text:calText+" / "+hrsTarget,kind:kind};
}
function pmsStanding(r){ var s=pmsStandingInfo(r); return pill(s.text,s.kind); }
/* is this job due or overdue right now, on either basis — used by dashboard alerts, KPIs and the printable report */
function pmsIsOverdue(r){
  if(r.status==="Completed"||r.status==="Postponed (approved)") return false;
  var s=pmsStandingInfo(r);
  return s.kind==="bad";
}

/* picks an icon for a KPI from its label, so every tab's figures get one */
function kpiIcon(label, cls){
  var s=String(label||"").toLowerCase();
  if(/fuel|litre|liter|bunker|consum/.test(s)) return "fuel";
  if(/value|cost|spend|₱|peso|amount|price|delivered and/.test(s)) return "money";
  if(/certif|licen|survey/.test(s)) return "award";
  if(/crew|seafarer|on board|onboard|manning|officer|rating/.test(s)) return "users";
  if(/defect|incident|near miss|finding|car\b|overdue|expired|safety report/.test(s)) return "alert";
  if(/drill|audit|inspection|ism|safety/.test(s)) return "shield";
  if(/maintenance|job|component|machinery|pms|engine|running hours/.test(s)) return "wrench";
  if(/requisition|purchase|order|procure/.test(s)) return "cart";
  if(/voyage|trip|cargo|port|passage/.test(s)) return "route";
  if(/vessel|fleet|ship/.test(s)) return "ship";
  if(/day|hour|due|within|month/.test(s)) return "clock";
  return "chart";
}

    for(var i=0;i<btns.length;i++){ btns[i].className = btns[i].getAttribute("data-m")===mod?"on":""; }
    var sn=document.getElementById("subnav");
    sn.innerHTML = m.tabs? m.tabs.map(function(t){return '<button class="'+(t.id===App.tab?"on":"")+'" onclick="App.go(\''+mod+'\',\''+t.id+'\')">'+esc(t.l)+'</button>';}).join("") : "";
    window.scrollTo(0,0);
    App.render();
  },

  module:function(){ for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===App.mod) return MODULES[i]; } return MODULES[0]; },

  render:function(){
    var v=document.getElementById("view");
    if(App.mod==="dashboard") return void(v.innerHTML=Views.dashboard());
    if(App.mod==="reports")   return void(v.innerHTML=Views.reports());
    if(App.tab==="fuellog")   return void(v.innerHTML=FuelLog.view());
    if(App.tab==="variance")  return void(v.innerHTML=FuelLog.varianceView());
    if(SCHEMAS[App.tab])      return void(v.innerHTML=Register.view(App.tab));
    if(Views[App.tab])        return void(v.innerHTML=Views[App.tab]());
    v.innerHTML='<div class="card"><div class="empty">Nothing to show here yet.</div></div>';
    App.refreshAlertBadge();
  },

  refreshAlertBadge:function(){
    var n=Alerts.all().length, b=document.getElementById("alertBtn");
    b.textContent = n? ("Alerts ("+n+")") : "Alerts";
    b.className = "tb"+(n?" warnbtn":"");
  },

  backup:function(){
    var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="NS-FLEET-backup-"+today()+".json"; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    UI.open("Back up data",
      '<p>A file named <b>NS-FLEET-backup-'+today()+'.json</b> has been prepared.</p>'+
      '<p style="font-size:13px;color:#5d7480">On iPad, if nothing downloaded, use the button below and choose <b>Save to Files</b> from the share sheet.</p>'+
      '<p><a class="btn" style="text-decoration:none;display:inline-block" href="'+url+'" download="NS-FLEET-backup-'+today()+'.json">Save backup file</a></p>',
      '<button class="btn g" onclick="UI.close()">Done</button>',"sm");
  },

  restore:function(){
    UI.pickFile(".json,application/json",function(file){
      var r=new FileReader();
      r.onload=function(){
        try{
          var d=JSON.parse(r.result);
          if(!d.vessels&&!d.crew) throw new Error("not NS FLEET");
          UI.confirm("Restoring replaces everything in the shared NS FLEET database for all fleet staff. Continue?").then(function(ok){
            if(!ok) return;
            var b=blankDB(); for(var k in b){ if(!d[k]) d[k]=b[k]; }
            if(!d.meta) d.meta=b.meta; if(!d.meta.counters) d.meta.counters={};
            DB=d; save(); App.go(App.mod); UI.toast("Data restored");
          });
        }catch(e){ UI.alert("That file could not be read as an NS FLEET backup. Choose the .json file created by <b>Back up data</b>."); }
      };
      r.readAsText(file);
    });
  }
};

/* ---------------- Generic register engine ---------------------------- */
var Register={

  rows:function(key){
    var s=SCHEMAS[key], data=DB[key]||[];
    var q=(App.filter.q||"").toLowerCase(), vf=App.filter.vessel;
    var out=data.filter(function(r){
      if(vf && r.vessel!==vf) return false;
      if(!q) return true;
      var hay="";
      for(var k in r){ var val=r[k]; if(typeof val==="string"||typeof val==="number") hay+=" "+val; }
      hay+=" "+vesselName(r.vessel);
      return hay.toLowerCase().indexOf(q)>=0;
    });
    return sortBy(out, s.sort||"id", !!s.sortDesc);
  },

  hasVessel:function(key){ return SCHEMAS[key].fields.some(function(f){return f.k==="vessel";}); },

  view:function(key){
    var s=SCHEMAS[key], rows=Register.rows(key);
    var cols=s.fields.filter(function(f){return f.col;});
    var h='<div class="card">';
    h+='<h2>'+esc(s.title)+'<span class="r">'+
        '<button class="btn sm o" onclick="Register.form(\''+key+'\')">Add '+esc(s.singular)+'</button>'+
        '<button class="btn sm g" onclick="Register.csv(\''+key+'\')">Export CSV</button>'+
        '<button class="btn sm g" onclick="Register.print(\''+key+'\')">Print</button>'+
        (key==="crew"?'<button class="btn sm g" onclick="Register.importCrew()">Import crew file</button>':'')+
       '</span></h2>';
    h+='<div class="toolbar">';
    h+='<input type="text" class="grow" placeholder="Search '+esc(s.title.toLowerCase())+'" value="'+esc(App.filter.q)+'" oninput="App.filter.q=this.value;Register.refresh(\''+key+'\')">';
    if(Register.hasVessel(key)){
      h+='<select onchange="App.filter.vessel=this.value;Register.refresh(\''+key+'\')"><option value="">All vessels</option>'+
         vesselOpts().map(function(o){return '<option value="'+o.v+'"'+(App.filter.vessel===o.v?" selected":"")+'>'+esc(o.l)+'</option>';}).join("")+'</select>';
    }
    h+='<span style="color:#5d7480;font-size:12.5px" id="cnt-'+key+'">'+rows.length+' record'+(rows.length===1?"":"s")+'</span>';
    h+='</div><div class="body tight" id="tbl-'+key+'">'+Register.table(key,rows,cols)+'</div></div>';
    h+='<p style="font-size:12px;color:#5d7480;margin:0 2px 20px">'+esc(s.sub)+'</p>';
    setTimeout(App.refreshAlertBadge,0);
    return h;
  },

  refresh:function(key){
    var rows=Register.rows(key), cols=SCHEMAS[key].fields.filter(function(f){return f.col;});
    document.getElementById("tbl-"+key).innerHTML=Register.table(key,rows,cols);
    document.getElementById("cnt-"+key).textContent=rows.length+" record"+(rows.length===1?"":"s");
  },

  cell:function(f,r){
    var v=r[f.k];
    if(f.t==="calc") return f.fn(r);
    if(f.t==="vessel") return esc(vesselName(v));
    if(f.t==="audit") return esc(auditLabel(v));
    if(f.t==="file") return v? '<a href="#" onclick="Register.viewFile(\''+esc(f.k)+'\',\''+r.id+'\',\''+App.tab+'\');return false;">View</a>' : '<span style="color:#9db3bd">—</span>';
    if(f.t==="date") return esc(dmy(v));
    if(f.t==="time") return esc(hhmm(v));
    if(f.t==="ro") return esc(v||"");
    if(f.t==="num"){ if(v===""||v==null) return ""; return esc(qty(v, String(v).indexOf(".")>=0?2:0)); }
    if(f.t==="area"){ var t=String(v||""); return esc(t.length>70?t.slice(0,70)+"…":t); }
    if(f.k==="status"||f.k==="state") return Register.statusCell(v);
    return esc(v);
  },

  statusCell:function(v){
    if(!v) return "";
    var bad=["Overdue","Open","Expired","Cancelled","Reported","Vessel stopped / critical"];
    var warn=["Due","Under repair","Awaiting spares","Under review","Under investigation","Requested","Findings issued","Deferred (risk assessed)","Corrective action in progress","Reliever Required","Drydock","Under Repair"];
    var ok=["Completed","Closed","Delivered","Onboard","At Sea","In Port","Approved","Valid"];
    var kind = bad.indexOf(v)>=0?"bad" : warn.indexOf(v)>=0?"warn" : ok.indexOf(v)>=0?"ok" : "info";
    return pill(v,kind);
  },

  table:function(key,rows,cols){
    if(!rows.length) return '<div class="empty"><b>Nothing recorded yet</b>Use "Add '+esc(SCHEMAS[key].singular)+'" to create the first entry.</div>';
    var h='<div class="tw"><table class="grid"><thead><tr>';
    cols.forEach(function(f){ h+='<th>'+esc(f.l)+'</th>'; });
    h+='<th>Actions</th></tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr>';
      cols.forEach(function(f){ h+='<td>'+Register.cell(f,r)+'</td>'; });
      h+='<td class="act">'+
         '<button class="btn sm g" onclick="Register.detail(\''+key+'\',\''+r.id+'\')">Open</button> '+
         '<button class="btn sm" onclick="Register.form(\''+key+'\',\''+r.id+'\')">Edit</button> '+
         '<button class="btn sm d" onclick="Register.del(\''+key+'\',\''+r.id+'\')">Delete</button></td></tr>';
    });
    return h+'</tbody></table></div>';
  },

  /* ---- form ---- */
  form:function(key,id){
    var s=SCHEMAS[key], rec = id? byId(DB[key],id) : null;
    if(key!=="vessels" && Register.hasVessel(key) && !DB.vessels.length && !rec){
      return UI.alert("Add a vessel first. Every record in NS FLEET is filed against a vessel, so the vessel register has to be populated before anything else.","No vessels yet");
    }
    var h='<div class="fgrid">', _lastOther="", _vals={};
    function matchShow(sf){
      if(!sf.showIf) return true;
      var tv=_vals[sf.showIf.k];
      if(sf.showIf.eq!==undefined) return tv===sf.showIf.eq;
      if(sf.showIf.neq!==undefined) return tv!==sf.showIf.neq;
      if(sf.showIf.in) return sf.showIf.in.indexOf(tv)>=0;
      if(sf.showIf.notIn) return sf.showIf.notIn.indexOf(tv)<0;
      return true;
    }
    s.fields.forEach(function(f){
      if(f.t==="sec"){
        var secHide=!matchShow(f);
        h+='<div class="fsec" id="frow_'+f.k+'"'+(secHide?' style="display:none"':'')+'>'+esc(f.l)+'</div>';
        return;
      }
      if(f.t==="calc") return;
      var live = f.on? ' oninput="'+f.on+'" onchange="'+f.on+'"' : '';
      var pre=Register._presets||{};
      var val = rec? (rec[f.k]==null?"":rec[f.k]) : (pre[f.k]!==undefined? pre[f.k] : (f.def? f.def() : ""));
      if(f.otherOf && rec){
        /* editing a record saved with a custom "Others" name: show that text in the free-type box, not the trigger field */
        var trig=s.fields.filter(function(x){return x.k===f.otherOf;})[0];
        if(trig && trig.opts && rec[f.otherOf] && trig.opts.indexOf(rec[f.otherOf])<0) val=rec[f.otherOf];
      }
      _vals[f.k]=val;
      var full = (f.t==="area"||f.t==="file")?" full":"";
      /* the free-type "Others" box only shows once its trigger select is actually set to "Others"; showIf fields hide until their trigger field matches */
      var hideRow = (f.otherOf && _lastOther!=="Others") || !matchShow(f);
      h+='<div class="f'+full+'" id="frow_'+f.k+'"'+(hideRow?' style="display:none"':'')+'><label>'+esc(f.l)+(f.req?' <span class="req">*</span>':'')+'</label>';
      if(f.t==="select"){
        var selVal=val;
        if(f.otherField && val && f.opts.indexOf(val)<0) selVal="Others";
        if(f.otherField) _lastOther=selVal;
        h+='<select id="fld_'+f.k+'"'+live+'><option value=""></option>'+f.opts.map(function(o){return '<option'+(String(selVal)===o?" selected":"")+'>'+esc(o)+'</option>';}).join("")+'</select>';
      } else if(f.t==="audit"){
        h+='<select id="fld_'+f.k+'"><option value="">— select audit —</option>'+auditOpts().map(function(o){return '<option value="'+o.v+'"'+(val===o.v?" selected":"")+'>'+esc(o.l)+'</option>';}).join("")+'</select>';
      } else if(f.t==="vessel"){
        h+='<select id="fld_'+f.k+'"'+live+'><option value="">— select vessel —</option>'+vesselOpts().map(function(o){return '<option value="'+o.v+'"'+(val===o.v?" selected":"")+'>'+esc(o.l)+'</option>';}).join("")+'</select>';
      } else if(f.t==="area"){
        h+='<textarea id="fld_'+f.k+'">'+esc(val)+'</textarea>';
      } else if(f.t==="ro"){
        h+='<input type="text" id="fld_'+f.k+'" value="'+esc(val)+'" readonly style="background:#eef4f7;font-weight:600">';
      } else if(f.t==="date"){
        h+='<input type="date" id="fld_'+f.k+'"'+(f.ro?' readonly style="background:#eef4f7"':'')+' value="'+esc(String(val).slice(0,10))+'"'+live+'>';
      } else if(f.t==="time"){
        h+='<input type="text" inputmode="numeric" maxlength="5" placeholder="1200" id="fld_'+f.k+'" value="'+esc(hhmm(val))+'" onblur="this.value=hhmm(this.value)'+(f.on?";"+f.on:"")+'"'+live+'>';
      } else if(f.t==="num"){
        h+='<input type="number" step="any" inputmode="decimal" id="fld_'+f.k+'"'+(f.ro?' readonly style="background:#eef4f7"':'')+' value="'+esc(val)+'"'+live+(f.focus?' onfocus="'+f.focus+'"':'')+'>';
      } else if(f.t==="file"){
        h+='<div class="filebox"><input type="hidden" id="fld_'+f.k+'" value=\''+(val?esc(JSON.stringify(val)):"")+'\'>'+
           '<button type="button" class="btn sm g" onclick="Register.attach(\''+f.k+'\')">Choose file</button>'+
           '<span id="fn_'+f.k+'">'+(val&&val.n?esc(val.n):"No file attached")+'</span>'+
           (val?' <button type="button" class="btn sm d" onclick="Register.detach(\''+f.k+'\')">Remove</button>':'')+
           '</div><div class="hint">Images or PDF up to 700 KB. Attachments are stored securely in the company database.</div>';
      } else {
        var listId="", comboAttrs="";
        if(f.list){ listId=' list="dl_'+f.k+'"'; comboAttrs=' autocomplete="off" onfocus="Register.openList(this)" onblur="Register.closeList(this)"'; }
        h+='<input type="text" id="fld_'+f.k+'"'+(f.ro?' readonly style="background:#f1f5f7"':'')+listId+comboAttrs+' value="'+esc(val)+'"'+(f.ro&&!rec?' placeholder="Generated automatically on save"':'')+live+'>';
        if(f.list) h+='<datalist id="dl_'+f.k+'">'+f.list.map(function(o){return '<option value="'+esc(o)+'">';}).join("")+'</datalist>';
      }
      if(f.hint) h+='<div class="hint">'+esc(f.hint)+'</div>';
      h+='</div>';
    });
    h+='</div>';
    Register._presets=null;
    UI.open((rec?"Edit ":"Add ")+esc(s.singular), h,
      '<button class="btn g" onclick="UI.close()">Cancel</button><button class="btn o" onclick="Register.save(\''+key+'\','+(id?"'"+id+"'":"null")+')">Save</button>', "lg");
    if(s.after) setTimeout(s.after,0);
  },

  toggleOtherCert:function(){
    var v=document.getElementById("fld_name"), row=document.getElementById("frow_nameOther");
    if(!v||!row) return;
    row.style.display = (v.value==="Others")? "" : "none";
  },

  /* shows/hides every field whose showIf trigger lives in this same form, based on the trigger's current value */
  applyShow:function(key){
    var s=SCHEMAS[key];
    s.fields.forEach(function(f){
      if(!f.showIf) return;
      var trig=document.getElementById("fld_"+f.showIf.k), row=document.getElementById("frow_"+f.k);
      if(!trig||!row) return;
      var tv=trig.value, vis = f.showIf.eq!==undefined? tv===f.showIf.eq : (f.showIf.neq!==undefined? tv!==f.showIf.neq : (f.showIf.in? f.showIf.in.indexOf(tv)>=0 : (f.showIf.notIn? f.showIf.notIn.indexOf(tv)<0 : true)));
      row.style.display = vis? "" : "none";
    });
  },

  /* clears the box on focus so the datalist shows every choice, not just ones matching what's already typed */
  openList:function(el){ el.dataset.prev=el.value; el.value=""; },
  closeList:function(el){ if(!el.value) el.value=el.dataset.prev||""; delete el.dataset.prev; },

  attach:function(k){
    UI.pickFile("image/*,application/pdf",function(file){
      if(file.size>700*1024) return UI.alert("That file is "+Math.round(file.size/1024)+" KB. Attachments must be 700 KB or smaller — re-save it at a lower resolution and try again.");
      var r=new FileReader();
      r.onload=function(){
        document.getElementById("fld_"+k).value=JSON.stringify({n:file.name,t:file.type,d:r.result});
        document.getElementById("fn_"+k).textContent=file.name;
      };
      r.readAsDataURL(file);
    });
  },
  detach:function(k){ document.getElementById("fld_"+k).value=""; document.getElementById("fn_"+k).textContent="No file attached"; },

  viewFile:function(fk,id,key){
    var r=byId(DB[key],id); if(!r||!r[fk]) return;
    var f=r[fk], isPdf=(f.t||"").indexOf("pdf")>=0;
    var body = isPdf? '<p><b>'+esc(f.n)+'</b></p><p style="font-size:13px;color:#5d7480">PDF attachments open in a new tab.</p>'
                    : '<p><b>'+esc(f.n)+'</b></p><img src="'+f.d+'" style="max-width:100%;border:1px solid #d7e1e6;border-radius:6px">';
    body+='<p style="font-size:12.5px;color:#5d7480;margin-top:10px">On iPad the download button is unreliable — use <b>Open in new tab</b>, then share or save from there.</p>';
    UI.open("Attachment", body,
      '<a class="btn g" style="text-decoration:none" href="'+f.d+'" download="'+esc(f.n)+'">Download</a>'+
      '<button class="btn" onclick="Register.openBlob(\''+fk+'\',\''+id+'\',\''+key+'\')">Open in new tab</button>'+
      '<button class="btn g" onclick="UI.close()">Close</button>');
  },
  openBlob:function(fk,id,key){
    var r=byId(DB[key],id), f=r[fk];
    try{
      var parts=f.d.split(","), bin=atob(parts[1]), arr=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      var url=URL.createObjectURL(new Blob([arr],{type:f.t||"application/octet-stream"}));
      window.open(url,"_blank");
    }catch(e){ window.open(f.d,"_blank"); }
  },

  save:function(key,id){
    var s=SCHEMAS[key], rec = id? byId(DB[key],id) : {id:uid(), created:new Date().toISOString()};
    var missing=[];
    s.fields.forEach(function(f){
      if(f.t==="sec"||f.t==="calc") return;
      var el=document.getElementById("fld_"+f.k); if(!el) return;
      var v=el.value;
      if(f.t==="file"){ rec[f.k] = v? JSON.parse(v) : null; return; }
      if(f.t==="time") v=hhmm(v);
      if(f.req && !String(v).trim()) missing.push(f.l);
      rec[f.k]=v;
    });
    if(missing.length) return UI.alert("These fields are required: <b>"+esc(missing.join(", "))+"</b>. Fill them in and save again.","Missing information");
    if(s.validate){ var err=s.validate(rec,id||null); if(err) return UI.alert(err,"Cannot save"); }
    if(!id){
      if(s.auto && !rec[s.auto.k]) rec[s.auto.k]=seq(key, s.auto.prefix, s.auto.pad);
      DB[key].push(rec);
    }
    rec.updated=new Date().toISOString();
    save(); UI.close(); App.render(); UI.toast(id?"Changes saved":"Record added");
  },

  del:function(key,id){
    var r=byId(DB[key],id);
    var label = r.name||r.refNo||r.jobNo||r.reqNo||r.voyageNo||r.ccn||r.crewName||"this record";
    UI.confirm("Delete "+label+"? This cannot be undone.").then(function(ok){
      if(!ok) return;
      DB[key]=DB[key].filter(function(x){return x.id!==id;});
      save(); App.render(); UI.toast("Record deleted");
    });
  },

  detail:function(key,id){
    var s=SCHEMAS[key], r=byId(DB[key],id); if(!r) return;
    var h='<div class="dl">';
    s.fields.forEach(function(f){
      if(f.t==="sec"){ h+='</div><div class="fsec" style="margin:10px 0 6px">'+esc(f.l)+'</div><div class="dl">'; return; }
      var v;
      if(f.t==="calc") v=f.fn(r);
      else if(f.t==="vessel") v=esc(vesselName(r[f.k]));
      else if(f.t==="audit") v=esc(auditLabel(r[f.k]));
      else if(f.t==="date") v=esc(dmy(r[f.k]));
      else if(f.t==="file") v=r[f.k]? esc(r[f.k].n) : "—";
      else if(f.t==="num") v=(r[f.k]===""||r[f.k]==null)?"—":esc(qty(r[f.k],String(r[f.k]).indexOf(".")>=0?2:0));
      else v=esc(r[f.k])||"—";
      h+='<div class="i"><span>'+esc(f.l)+'</span><b>'+(v||"—")+'</b></div>';
    });
    h+='</div>';
    var extra = key==="vessels" ? Register.vesselDossier(r) : (key==="audits" ? Register.auditFindings(r) : "");
    UI.open(esc(s.singular.charAt(0).toUpperCase()+s.singular.slice(1))+" details", h+extra,
      '<button class="btn g" onclick="UI.close()">Close</button><button class="btn" onclick="UI.close();Register.form(\''+key+'\',\''+id+'\')">Edit</button>', "lg");
  },

  addFinding:function(auditId){
    var a=byId(DB.audits,auditId);
    Register._presets={audit:auditId, vessel:a?a.vessel||"":"", raisedBy:a?a.auditor||"":"", targetDate:a?a.targetDate||"":""};
    UI.close(); App.go("safety","findings");
    setTimeout(function(){ Register.form("findings"); },120);
  },

  auditFindings:function(a){
    var f=(DB.findings||[]).filter(function(x){return x.audit===a.id;});
    var open=f.filter(function(x){return x.status!=="Verified and closed";}).length;
    var stated=num(a.ncr)+num(a.observations);
    var h='<div class="fsec" style="margin:14px 0 8px">Findings raised at this audit</div>';
    if(stated && f.length<stated)
      h+='<div style="background:#fdf3dd;border:1px solid #f0dfb0;border-radius:6px;padding:10px 12px;font-size:13px;color:#7a5a10;margin-bottom:10px">'+
         'The audit report states <b>'+stated+'</b> finding'+(stated===1?"":"s")+' but only <b>'+f.length+'</b> '+(f.length===1?"is":"are")+
         ' logged. Log each one so it carries its own root cause, owner and close-out date.</div>';
    if(!f.length) h+='<p style="font-size:13.5px;color:#5d7480;margin:0 0 10px">No findings logged against this audit yet.</p>';
    else{
      h+='<div class="tw"><table class="grid"><thead><tr><th>No.</th><th>Category</th><th>Reference</th><th>Finding</th><th>Responsible</th><th>Target</th><th>Status</th><th></th></tr></thead><tbody>';
      sortBy(f,"refNo").forEach(function(x){
        var late = x.status!=="Verified and closed" && x.targetDate && days(x.targetDate)<0;
        h+='<tr><td>'+esc(x.refNo||"")+'</td><td>'+(x.category==="Major non-conformity"?pill("Major NC","bad"):(x.category==="Observation"?pill("Obs","info"):pill("NC","warn")))+'</td>'+

          rec.sirbNo = pick(src,["sirb","sirbno"])||"";

function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function pick(obj,keys){
  for(var k in obj){ var n=norm(k); for(var i=0;i<keys.length;i++){ if(n===keys[i]) return obj[k]; } }
  for(var k2 in obj){ var n2=norm(k2); for(var j=0;j<keys.length;j++){ if(n2.indexOf(keys[j])>=0) return obj[k2]; } }
  return "";
}
function dateish(v){
  if(!v) return "";
  var s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
  var d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return "";
}
function findArray(d){
  if(Array.isArray(d)&&d.length&&typeof d[0]==="object") return d;
  var best=[];
  for(var k in d){
    var v=d[k];
    if(Array.isArray(v)&&v.length&&typeof v[0]==="object"){
      if(/crew|roster|seafarer|personnel/i.test(k)) return v;
      if(v.length>best.length) best=v;
    }
  }
  return best;
}
function parseCSV(text){
  var lines=text.replace(/\r/g,"").split("\n").filter(function(l){return l.trim();});
  if(lines.length<2) return [];
  function split(l){
    var out=[],cur="",q=false;
    for(var i=0;i<l.length;i++){
      var c=l[i];
      if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"') q=true; else if(c===","){ out.push(cur); cur=""; } else cur+=c; }
    }
    out.push(cur); return out;
  }
  var head=split(lines[0]);
  return lines.slice(1).map(function(l){
    var cells=split(l), o={};
    head.forEach(function(h,i){ o[h.trim()]=(cells[i]||"").trim(); });
    return o;
  });
}

var Alerts={
  all:function(){
    var out=[];
    (DB.certificates||[]).forEach(function(c){
      if(!c.expiry) return; var d=days(c.expiry);
      var who = c.vessel? vesselName(c.vessel) : "Company";
      if(d<0) out.push({k:"bad",t:who+" — "+(c.name||"certificate")+" expired",s:"Expired "+dmy(c.expiry)+" ("+Math.abs(d)+" days ago). Vessel should not trade on an expired certificate.",go:["certs","certificates"]});
      else if(d<=60) out.push({k:"warn",t:who+" — "+(c.name||"certificate")+" expires in "+d+" days",s:"Expiry "+dmy(c.expiry)+". Start the renewal with "+(c.issuer||"the issuing authority")+".",go:["certs","certificates"]});
    });
    (DB.pmsjobs||[]).forEach(function(j){
      if(j.status==="Completed"||j.status==="Postponed (approved)") return;
      var st=pmsStandingInfo(j);
      if(st.kind==="bad") out.push({k:(j.criticality==="Critical equipment"?"bad":"warn"),t:vesselName(j.vessel)+" — "+(j.job||"maintenance job")+" overdue",s:(j.component||"")+" · "+st.text,go:["pms","pmsjobs"]});
      else if(st.kind==="warn") out.push({k:"info",t:vesselName(j.vessel)+" — "+(j.job||"maintenance job")+" due soon",s:(j.component||"")+" · "+st.text,go:["pms","pmsjobs"]});
    });
    (DB.crew||[]).forEach(function(c){
      if(c.status==="Separated") return;
      if(c.contractEnd){ var d=days(c.contractEnd);
        if(d<0) out.push({k:"bad",t:(c.name||"Crew")+" — contract expired",s:vesselName(c.vessel)+" · ended "+dmy(c.contractEnd)+". Arrange relief or extension.",go:["crewmgmt","crew"]});
        else if(d<=30) out.push({k:"warn",t:(c.name||"Crew")+" — contract ends in "+d+" days",s:vesselName(c.vessel)+" · "+(c.rank||"")+". Nominate a reliever.",go:["crewmgmt","crew"]});
      }
      [["SIRB",c.sirbExp],["Licence / COP",c.licenseExp],["Medical certificate",c.medicalExp],["MARINA ID / SID",c.sidExp]].forEach(function(p){
        if(!p[1]) return; var d=days(p[1]);
        if(d<0) out.push({k:"bad",t:(c.name||"Crew")+" — "+p[0]+" expired",s:vesselName(c.vessel)+" · expired "+dmy(p[1]),go:["crewmgmt","crew"]});
        else if(d<=45) out.push({k:"warn",t:(c.name||"Crew")+" — "+p[0]+" expires in "+d+" days",s:vesselName(c.vessel)+" · "+dmy(p[1]),go:["crewmgmt","crew"]});
      });
    });
    (DB.defects||[]).forEach(function(f){
      if(f.status==="Closed") return;
      if(f.severity==="Critical") out.push({k:"bad",t:vesselName(f.vessel)+" — critical defect open",s:(f.equipment||"")+": "+(f.description||"").slice(0,90),go:["pms","defects"]});
      else if(f.targetDate&&days(f.targetDate)<0) out.push({k:"warn",t:vesselName(f.vessel)+" — defect past target date",s:(f.equipment||"")+" · target "+dmy(f.targetDate),go:["pms","defects"]});
    });
    (DB.incidents||[]).forEach(function(i){
      if(i.status==="Closed") return;
      if(i.targetDate&&days(i.targetDate)<0) out.push({k:"warn",t:"Report "+(i.refNo||"")+" past close-out date",s:(i.title||"")+" · target "+dmy(i.targetDate),go:["safety","incidents"]});
      else if(i.severity==="Critical") out.push({k:"bad",t:"Critical report open — "+(i.refNo||""),s:(i.title||"")+" · "+vesselName(i.vessel),go:["safety","incidents"]});
    });
    (DB.audits||[]).forEach(function(a){
      if(a.status==="Closed") return;
      if(a.targetDate&&days(a.targetDate)<0) out.push({k:"warn",t:"Audit "+(a.refNo||"")+" findings not closed",s:(a.type||"")+" · target "+dmy(a.targetDate),go:["safety","audits"]});
    });
    (DB.findings||[]).forEach(function(f){
      if(f.status==="Verified and closed") return;
      var who=f.vessel? vesselName(f.vessel) : "Office";
      var late=f.targetDate && days(f.targetDate)<0;
      if(f.category==="Major non-conformity")
        out.push({k:"bad",t:who+" — major non-conformity open ("+(f.refNo||"")+")",
          s:String(f.description||"").slice(0,90)+(f.targetDate?" · target "+dmy(f.targetDate):""),go:["safety","findings"]});
      else if(late)
        out.push({k:"warn",t:who+" — finding "+(f.refNo||"")+" past its close-out date",
          s:String(f.description||"").slice(0,80)+" · target "+dmy(f.targetDate)+" ("+Math.abs(days(f.targetDate))+" days)",go:["safety","findings"]});
    });
    (DB.audits||[]).forEach(function(a){
      if(a.status!=="Closed") return;
      var open=(DB.findings||[]).filter(function(x){return x.audit===a.id && x.status!=="Verified and closed";}).length;
      if(open) out.push({k:"warn",t:"Audit "+(a.refNo||"")+" closed with findings still open",
        s:open+" finding"+(open===1?"":"s")+" not verified. "+(a.type||""),go:["safety","findings"]});
    });
    Audit.dueList().forEach(function(a){
      var who = a.vessel? vesselName(a.vessel) : "Office";
      var d=days(a.nextDue);
      out.push({k:(d<0?"bad":"warn"),
        t:who+" — "+a.type+(d<0? " overdue by "+Math.abs(d)+" days" : " due in "+d+" days"),
        s:"Last held "+dmy(a.date)+(a.refNo?" ("+a.refNo+")":"")+". Next due "+dmy(a.nextDue)+".",
        go:["safety","audits"]});
    });
    DrillPlan.gaps().forEach(function(g){
      out.push({k:g.overdue>15?"bad":"warn",t:g.vessel+" — "+g.drill+" drill overdue",s:g.last?("Last held "+dmy(g.last)+", "+g.overdue+" days past the monthly interval"):"No drill recorded for this vessel",go:["safety","drills"]});
    });
    FuelLog.flagged().forEach(function(r){
      var c=FuelLog.calc(r);
      var worst=c.rows.filter(function(x){return x.state==="off";})
        .map(function(x){return x.tag+" "+(x.pct>0?"+":"")+x.pct.toFixed(1)+"%";}).join(", ");
      out.push({k:"warn",t:vesselName(r.vessel)+" — fuel report out of range "+dmy(r.date),
        s:"Reported "+qty(c.used)+" L against an expected "+qty(c.expected)+" L ("+worst+"). Verify the figures with the vessel.",
        go:["fuel","variance"]});
    });
    (DB.fuellog||[]).forEach(function(r){
      var b=FuelLog.balance(r);
      if(!b.flag) return;
      out.push({k:"warn",t:vesselName(r.vessel)+" — fuel ROB does not balance "+dmy(r.date),
        s:"Sounding "+qty(b.sounded)+" L against a calculated "+qty(b.calculated)+" L (opening "+qty(b.opening)+
          " \u2212 consumed "+qty(b.consumed)+"). Difference "+(b.diff>0?"+":"")+qty(b.diff)+" L.",
        go:["fuel","fuellog"]});
    });
    (DB.requisitions||[]).forEach(function(q){
      if(q.urgency==="Vessel stopped / critical" && ["Requested","Under review","Approved"].indexOf(q.status)>=0)
        out.push({k:"bad",t:vesselName(q.vessel)+" — critical requisition awaiting supply",s:(q.reqNo||"")+": "+String(q.item||"").slice(0,80),go:["procurement","requisitions"]});
    });
    var rank={bad:0,warn:1,info:2};
    return out.sort(function(a,b){return rank[a.k]-rank[b.k];});
  }
};

/* ---------------- Drill compliance (monthly interval) ----------------- */
var DrillPlan={
  mandatory:["Abandon ship","Fire fighting"],
  lastFor:function(vId,drill){
    var recs=(DB.drills||[]).filter(function(d){return d.vessel===vId&&d.drill===drill&&d.date;});
    if(!recs.length) return null;
    return sortBy(recs,"date",true)[0].date;
  },
  gaps:function(){
    var out=[], started=(DB.drills||[]).length>0;
    if(!started) return out;
    (DB.vessels||[]).forEach(function(v){
      if(v.status==="Laid-up") return;
      DrillPlan.mandatory.forEach(function(d){
        var last=DrillPlan.lastFor(v.id,d);
        var over = last? -days(last)-31 : null;
        if(!last) out.push({vessel:v.name,drill:d,last:null,overdue:999});
        else if(over>0) out.push({vessel:v.name,drill:d,last:last,overdue:over});
      });
    });
    return out;
  }
};

    '<div class="kpi money"><div class="n">'+qty(litres)+' L</div><div class="l">Fuel bunkered</div></div>'+
    '<div class="kpi money"><div class="n">'+peso(cost)+'</div><div class="l">Fuel cost</div></div>'+
    '<div class="kpi money"><div class="n">'+peso(avg)+'</div><div class="l">Average price per litre</div></div>'+
    '<div class="kpi money"><div class="n">'+qty(used)+' L</div><div class="l">Fuel consumed</div></div>'+
    '<div class="kpi money"><div class="n">'+(hrs?qty(used/hrs,1):"—")+' L/hr</div><div class="l">Fleet average consumption</div></div>'+
    '<div class="kpi money'+(expd>0&&Math.abs((used-expd)/expd*100)>10?" danger":"")+'"><div class="n">'+(expd>0?((used-expd)/expd*100>0?"+":"")+((used-expd)/expd*100).toFixed(1)+"%":"—")+'</div><div class="l">Variance against declared rates</div></div>'+
    '</div>';
  var byV={};
  b.forEach(function(x){ var n=vesselName(x.vessel)||"Unassigned"; var o=byV[n]=byV[n]||{l:0,c:0,u:0,h:0}; o.l+=num(x.litres); o.c+=num(x.litres)*num(x.price); });
  c.forEach(function(x){ var n=vesselName(x.vessel)||"Unassigned"; var o=byV[n]=byV[n]||{l:0,c:0,u:0,h:0,e:0}; var k=FuelLog.calc(x); o.u+=k.used; o.h+=k.hours; o.e+=k.expected; });
  var rows=Object.keys(byV).sort().map(function(k){
    var o=byV[k], p = o.e>0? ((o.u-o.e)/o.e)*100 : null;
    return [k,qty(o.l)+" L",peso(o.c),qty(o.u)+" L",qty(o.h,1),o.h?qty(o.u/o.h,1)+" L/hr":"—",
            p===null?"—":pill((p>0?"+":"")+p.toFixed(1)+"%", Math.abs(p)>10?"bad":(Math.abs(p)>5?"warn":"ok"))];
  });
  h+=tableCard("Fuel by vessel",["Vessel","Bunkered","Cost","Consumed","Hours run","Actual rate","Variance"],rows,'<button class="btn sm g" onclick="Views.printFuel()">Print</button>');

/* =====================================================================
   FUEL — engine register, daily consumption entry and variance check
   Expected fuel = (hours at sea x rate at sea) + (hours in port x rate in port)
   per engine. Reported against expected, flagged outside the tolerance.
   ===================================================================== */

function shortTag(unit){
  if(!unit) return "";
  if(ENGINE_TAGS[unit]) return ENGINE_TAGS[unit];
  var m=String(unit).match(/No\.(\d)/), side=/\(P\)/.test(unit)?" (P)":(/\(S\)/.test(unit)?" (S)":"");
  return (/Main/i.test(unit)?"ME":"AE")+(m?m[1]:"")+side;
}
function enginesFor(vid){
  return (DB.engines||[]).filter(function(e){return e.vessel===vid;})
    .sort(function(a,b){
      var ia=ENGINE_UNITS.indexOf(a.unit), ib=ENGINE_UNITS.indexOf(b.unit);
      if(ia<0) ia=99; if(ib<0) ib=99;
      return ia-ib || String(a.unit).localeCompare(String(b.unit));
    });
}
function findEngine(vid,unit){
  var l=(DB.engines||[]).filter(function(e){return e.vessel===vid&&e.unit===unit;});
  return l.length?l[0]:null;
}

/* fuel grades only — lube, hydraulic oil and grease do not move the fuel ROB */
function isFuelGrade(g){ return /diesel|gas oil/i.test(String(g||"")); }

var FuelLog={

  /* a report is stamped at its own date and time; an untimed one closes the day.
     a bunkering with no time is treated as start of day, so older records behave
     exactly as they did before times were recorded.                              */
  stamp:function(rec){ return String(rec.date||"")+"T"+(hhmm(rec.time)||"2359"); },
  bunkerStamp:function(b){ return String(b.date||"")+"T"+(hhmm(b.time)||"0000"); },

  /* bunkers taken between the previous report and this one */
  receivedFor:function(rec){
    var to=FuelLog.stamp(rec);
    var prev=FuelLog.prevEntry(rec);
    var from = prev? FuelLog.stamp(prev) : String(rec.date||"")+"T00:00";
    return (DB.bunkers||[]).filter(function(b){
      if(b.vessel!==rec.vessel || !isFuelGrade(b.grade)) return false;
      var st=FuelLog.bunkerStamp(b);
      return prev? (st>from && st<=to) : (st>=from && st<=to);
    }).sort(function(a,b2){ return FuelLog.bunkerStamp(a)<FuelLog.bunkerStamp(b2)?-1:1; });
  },

  /* the report immediately before this one for the same vessel */
  prevEntry:function(rec){
    return FuelLog.previous(rec.vessel, FuelLog.key(rec), rec.id);
  },

  /* entries are chained by date, then by the order they were created on that date,
     so several reports on one day (departure, noon, arrival) follow each other       */
  key:function(rec){
    return FuelLog.stamp(rec)+"|"+String(rec.created||"\uffff");
  },
  previous:function(vid,key,excludeId){
    var list=(DB.fuellog||[]).filter(function(x){
      return x.vessel===vid && x.id!==excludeId && FuelLog.key(x)<key;
    });
    if(!list.length) return null;
    list.sort(function(a,b){ var ka=FuelLog.key(a), kb=FuelLog.key(b); return ka<kb?1:(ka>kb?-1:0); });
    return list[0];
  },

  /* the closing ROB of the previous report for this vessel — what this entry opens with */
  carried:function(vid,date,excludeId,created,time){
    var p=FuelLog.previous(vid, FuelLog.key({date:date,time:time,created:created}), excludeId);
    if(!p) return null;
    return {value:FuelLog.closing(p,0), date:p.date, time:p.time||"", ref:p.refNo||"", type:p.reportType||""};
  },

  /* last bunkering before this date that recorded a ROB — offered as a starting figure */
  seedFromBunker:function(vid,date){
    var l=(DB.bunkers||[]).filter(function(b){
      return b.vessel===vid && isFuelGrade(b.grade) && String(b.robAfter||"").trim()!=="" && String(b.date)<=String(date);
    });
    if(!l.length) return null;
    var b=sortBy(l,"date",true)[0];
    return {value:num(b.robAfter), date:b.date, ref:b.refNo||""};
  },

  /* the auto-suggested Opening ROB: the previous report's closing ROB (or, if there is none yet, the most
     recent bunkering's own "ROB after" reading) PLUS every bunkering received since then and up to this
     report's own date/time — folded into one figure, not shown as a separate running total. */
  openingAuto:function(rec,depth){
    var recv=FuelLog.receivedFor(rec).reduce(function(t,b){return t+num(b.litres);},0);
    var p=FuelLog.prevEntry(rec);
    if(p){ var c=FuelLog.closing(p,(depth||0)+1); return c===null? null : c+recv; }
    var seed=FuelLog.seedFromBunker(rec.vessel,rec.date);
    return seed? seed.value+recv : null;
  },

  /* what the fuel ledger expects the ROB to be right after this bunkering — the last known ROB (a daily
     report's closing figure, or an earlier bunkering's own "ROB after") plus every bunkering since then,
     up to and including this one. Used to cross-check the Master's entered "ROB after bunkering". Returns
     null when there is nothing earlier in the ledger to check against. */
  expectedRobAfterBunker:function(b){
    if(!isFuelGrade(b.grade)) return null;
    var stamp=FuelLog.bunkerStamp(b);
    var baseRob=null, baseStamp=null;
    (DB.fuellog||[]).forEach(function(e){
      if(e.vessel!==b.vessel) return;
      var st=FuelLog.stamp(e);
      if(st>=stamp) return;
      if(!baseStamp || st>baseStamp){ var c=FuelLog.closing(e,0); if(c!==null){ baseRob=c; baseStamp=st; } }
    });
    (DB.bunkers||[]).forEach(function(x){
      if(x.vessel!==b.vessel || x.id===b.id || !isFuelGrade(x.grade)) return;
      var st=FuelLog.bunkerStamp(x);
      if(st>=stamp || String(x.robAfter||"").trim()==="") return;
      if(!baseStamp || st>baseStamp){ baseRob=num(x.robAfter); baseStamp=st; }
    });
    if(baseRob===null) return null;
    var since=(DB.bunkers||[]).filter(function(x){
      if(x.vessel!==b.vessel || !isFuelGrade(x.grade)) return false;
      var st=FuelLog.bunkerStamp(x);
      return st>baseStamp && st<=stamp;
    });
    return baseRob + since.reduce(function(t,x){return t+num(x.litres);},0);
  },

  /* closing ROB of an entry: the sounding if the Master gave one, else the calculated figure */
  closing:function(rec,depth){
    if(!rec||(depth||0)>60) return null;
    if(String(rec.robEnd||"").trim()!=="") return num(rec.robEnd);
    var b=FuelLog.balance(rec,(depth||0)+1);
    return b.calculated;
  },

  /* opening (already inclusive of any bunkering received since the last report) − consumed = calculated, against the sounding */
  balance:function(rec,depth){
    var consumed=FuelLog.calc(rec).used;
    var list=FuelLog.receivedFor(rec);
    var recv=list.reduce(function(t,b){return t+num(b.litres);},0);
    var opening=null, source="";
    if(String(rec.openingROB||"").trim()!==""){ opening=num(rec.openingROB); source="entered"; }
    else{
      opening=FuelLog.openingAuto(rec,depth);
      if(opening!==null){
        var p=FuelLog.prevEntry(rec);
        var bunkNote = recv? (" plus "+qty(recv)+" L bunkered since") : "";
        source = p? ("carried forward from "+(p.refNo?p.refNo+" · ":"")+dmy(p.date)+(p.time?" "+hhmm(p.time):"")+bunkNote)
                   : ("seeded from the last bunkering record"+bunkNote);
      }
    }
    var calculated = opening===null? null : opening-consumed;
    var sounded = String(rec.robEnd||"").trim()===""? null : num(rec.robEnd);
    var diff = (calculated===null||sounded===null)? null : sounded-calculated;
    /* allow the greater of 50 litres or 2% of the calculated figure for sounding error */
    var allow = calculated===null? 0 : Math.max(50, Math.abs(calculated)*0.02);
    return {opening:opening,source:source,received:recv,list:list,bunkerings:list.length,
            consumed:consumed,calculated:calculated,sounded:sounded,diff:diff,allow:allow,
            flag:(diff!==null && Math.abs(diff)>allow)};
  },

  robPill:function(b){
    if(b.diff===null) return pill("—","neu");
    var v=(b.diff>0?"+":"")+qty(b.diff)+" L";
    return b.flag? pill(v+" — check","bad") : pill(v,"ok");
  },

  /* ---- compute one record ---- */
  calc:function(rec){
    var out={rows:[],used:0,expected:0,hours:0,flags:0,worst:0,noStandard:0,usedMain:0,usedAux:0,hoursMain:0,hoursAux:0};
    (rec.rows||[]).forEach(function(r){
      var e=findEngine(rec.vessel,r.unit);
      var rs=e?num(e.rateSea):0, rp=e?num(e.ratePort):0;
      var tol=e&&e.tolerance!==""&&e.tolerance!=null? num(e.tolerance) : 10;
      var sea=num(r.seaHrs), port=num(r.portHrs), used=num(r.used);
      var exp=sea*rs+port*rp, hrs=sea+port;
      var pct = exp>0 ? ((used-exp)/exp)*100 : null;
      var state="ok";
      if(!e) state="noengine";
      else if(exp<=0 && used>0) state="nostandard";
      else if(pct===null) state="none";
      else if(Math.abs(pct)>tol) state="off";
      if(state==="off") out.flags++;
      if(state==="nostandard"||state==="noengine") out.noStandard++;
      if(pct!==null && Math.abs(pct)>Math.abs(out.worst)) out.worst=pct;
      out.rows.push({unit:r.unit,tag:shortTag(r.unit),sea:sea,port:port,used:used,
                     rateSea:rs,ratePort:rp,tol:tol,expected:exp,hours:hrs,pct:pct,state:state});
      out.used+=used; out.expected+=exp; out.hours+=hrs;
      if(/Main/i.test(r.unit)){ out.usedMain+=used; out.hoursMain+=hrs; } else { out.usedAux+=used; out.hoursAux+=hrs; }
    });
    out.pct = out.expected>0 ? ((out.used-out.expected)/out.expected)*100 : null;
    return out;
  },

  variancePill:function(c){
    if(c.noStandard && !c.flags) return pill("No standard set","neu");
    if(c.pct===null) return pill("—","neu");
    var v=(c.pct>0?"+":"")+c.pct.toFixed(1)+"%";
    if(c.flags) return pill(v+" — out of range","bad");
    if(Math.abs(c.pct)>5) return pill(v,"warn");
    return pill(v,"ok");
  },

  view:function(){

    });
    rows.sort(function(a,b){ var ka=FuelLog.key(a), kb=FuelLog.key(b); return ka<kb?1:(ka>kb?-1:0); });
    var h='<div class="card"><h2>Daily fuel consumption<span class="r">'+

      '<button class="btn sm g" onclick="FuelLog.print()">Print</button></span></h2>';
    h+='<div class="toolbar">'+
      '<input type="text" class="grow" placeholder="Search entries" value="'+esc(App.filter.q)+'" oninput="App.filter.q=this.value;App.render()">'+
      '<select onchange="App.filter.vessel=this.value;App.render()"><option value="">All vessels</option>'+

      '<span style="color:#5d7480;font-size:12.5px">'+rows.length+' entr'+(rows.length===1?"y":"ies")+'</span></div>';
    if(!rows.length){
      h+='<div class="empty"><b>No daily entries yet</b>Register the engines for each vessel first, then encode the daily figures here.</div></div>';
      return h;
    }
    h+='<div class="body tight"><div class="tw"><table class="grid"><thead><tr>'+
      '<th>Ref.</th><th>Date</th><th>Time</th><th>Report type</th><th>Vessel</th><th>Hours run</th><th>Reported (L)</th><th>Expected (L)</th><th>Variance</th><th>Bunkered (L)</th><th>ROB calculated</th><th>ROB sounded</th><th>ROB check</th><th>Actions</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var c=FuelLog.calc(r), b=FuelLog.balance(r);
      h+='<tr><td>'+esc(r.refNo||"")+'</td><td>'+esc(dmy(r.date))+'</td><td>'+esc(hhmm(r.time))+'</td><td>'+(r.reportType?pill(r.reportType.split(" — ")[0],"info"):"")+'</td><td>'+esc(vesselName(r.vessel))+'</td>'+
         '<td>'+qty(c.hours,1)+'</td><td><b>'+qty(c.used)+'</b></td><td>'+qty(c.expected)+'</td>'+
         '<td>'+FuelLog.variancePill(c)+'</td>'+
         '<td>'+(b.received?qty(b.received):'<span style="color:#9db3bd">—</span>')+'</td>'+
         '<td>'+(b.calculated===null?'<span style="color:#9db3bd">—</span>':qty(b.calculated))+'</td>'+
         '<td>'+(b.sounded===null?'<span style="color:#9db3bd">—</span>':'<b>'+qty(b.sounded)+'</b>')+'</td>'+
         '<td>'+FuelLog.robPill(b)+'</td>'+
         '<td class="act"><button class="btn sm g" onclick="FuelLog.detail(\''+r.id+'\')">Open</button> '+
         '<button class="btn sm" onclick="FuelLog.form(\''+r.id+'\')">Edit</button> '+
         '<button class="btn sm d" onclick="FuelLog.del(\''+r.id+'\')">Delete</button></td></tr>';
    });
    return h+'</tbody></table></div></div></div>'+
      '<p style="font-size:12px;color:#5d7480;margin:0 2px 20px">Expected fuel is calculated per engine as hours at sea &times; rate at sea, plus hours in port &times; rate in port, using the declared rates in the engine register.</p>';
  },

  buildRows:function(vid, rec){

    });

       '<td id="fr_tused">—</td><td id="fr_texp">—</td><td id="fr_tvar">—</td></tr></tfoot></table></div>'+
       '<div id="fr_warn" style="margin-top:10px"></div>';

  },

  read:function(){
    var vid=document.getElementById("fl_vessel").value;
    var eng=enginesFor(vid), rows=[];
    eng.forEach(function(e,i){
      var u=document.getElementById("fr_unit_"+i); if(!u) return;
      rows.push({unit:u.value,
        seaHrs:document.getElementById("fr_sea_"+i).value,
        portHrs:document.getElementById("fr_port_"+i).value,
        used:document.getElementById("fr_used_"+i).value});
    });
    var el=function(i){ var e=document.getElementById(i); return e?e.value:""; };
    var cur=FuelLog._editing? byId(DB.fuellog,FuelLog._editing) : null;
    return {vessel:vid, rows:rows, date:el("fl_date"), time:el("fl_time"), openingROB:el("fl_open"), robEnd:el("fl_rob"),
            id:FuelLog._editing||null, created:cur?cur.created:null};
  },

  live:function(){
    var d=FuelLog.read(), c=FuelLog.calc(d);
    c.rows.forEach(function(r,i){
      var ex=document.getElementById("fr_exp_"+i), va=document.getElementById("fr_var_"+i);
      if(!ex) return;
      ex.textContent = r.expected>0? qty(r.expected)+" L" : "—";
      if(r.state==="off") va.innerHTML=pill((r.pct>0?"+":"")+r.pct.toFixed(1)+"% \u2014 check","bad");
      else if(r.state==="nostandard") va.innerHTML=pill("No rate set","warn");
      else if(r.pct===null) va.innerHTML='<span style="color:#9db3bd">—</span>';
      else va.innerHTML=pill((r.pct>0?"+":"")+r.pct.toFixed(1)+"%", Math.abs(r.pct)>5?"warn":"ok");
    });
    var tu=document.getElementById("fr_tused"); if(!tu) return;
    tu.textContent=qty(c.used)+" L";
    document.getElementById("fr_texp").textContent=qty(c.expected)+" L";
    document.getElementById("fr_tvar").innerHTML=FuelLog.variancePill(c);
    FuelLog.syncOpening();
    d.openingROB=(document.getElementById("fl_open")||{value:""}).value;
    FuelLog.liveROB(d);
    var w=document.getElementById("fr_warn");
    if(c.flags){
      var lines=c.rows.filter(function(r){return r.state==="off";}).map(function(r){
        return '<li><b>'+esc(r.tag)+'</b>: reported '+qty(r.used)+' L against an expected '+qty(r.expected)+' L for '+qty(r.hours,1)+
               ' hours run — '+(r.pct>0?"over":"under")+' by '+Math.abs(r.pct).toFixed(1)+'% (tolerance &plusmn;'+r.tol+'%)</li>';
      }).join("");
      w.innerHTML='<div style="background:#fbe4e2;border:1px solid #f0bdb8;border-radius:6px;padding:10px 12px;font-size:13px;color:#7a1a15">'+
        '<b>Out of range — check the figures before saving</b><ul style="margin:6px 0 0;padding-left:18px">'+lines+'</ul>'+
        '<div style="margin-top:6px;font-size:12.5px">If the figures are correct, save anyway and note the reason in the remarks. The entry will stay flagged on the dashboard.</div></div>';
    } else w.innerHTML="";
  },

  openTouched:function(){ FuelLog._openManual=true; FuelLog.live(); },

  /* fill the opening figure from the previous report unless the user typed over it */
  syncOpening:function(){
    var fo=document.getElementById("fl_open"); if(!fo) return null;
    var vid=document.getElementById("fl_vessel").value;
    var date=document.getElementById("fl_date").value;
    var cur=FuelLog._editing? byId(DB.fuellog,FuelLog._editing) : null;
    var tm=(document.getElementById("fl_time")||{value:""}).value;
    var draft={vessel:vid,date:date,time:tm,id:FuelLog._editing||null,created:cur?cur.created:null};
    var auto=FuelLog.openingAuto(draft);
    if(!FuelLog._openManual){
      fo.value = auto!==null? auto : "";
    }
    return auto;
  },

  liveROB:function(d){
    var box=document.getElementById("fl_rob_block"); if(!box) return;
    var b=FuelLog.balance(d);
    var info=document.getElementById("fl_openinfo");
    if(info){
      var c=FuelLog.carried(d.vessel,d.date,FuelLog._editing||null,d.created,d.time);
      var auto=FuelLog.openingAuto(d);
      var bunkNote = b.received? (" plus "+qty(b.received)+" L bunkered since") : "";
      if(auto===null){
        info.textContent="First report for this vessel — enter the opening ROB to start the running balance.";
      } else if(FuelLog._openManual && Math.abs(num(d.openingROB)-auto)>0.001){
        info.innerHTML='<span style="color:#b6801a">Entered manually. The fuel ledger works out <b>'+qty(auto)+' L</b>'+
          (c&&c.value!==null?' ('+qty(c.value)+' L carried forward'+esc(bunkNote)+')':esc(bunkNote))+' — '+
          '<a href="#" onclick="FuelLog.resetOpening();return false;">use that figure</a>.</span>';
      } else if(c && c.value!==null){
        info.innerHTML='Linked to '+esc(c.ref?c.ref+" · ":"")+esc(c.type?c.type.split(" — ")[0]+" · ":"")+esc(dmy(c.date))+esc(c.time?" "+hhmm(c.time):"")+
          ' — closed at <b>'+qty(c.value)+' L</b>'+esc(bunkNote)+(b.received?' = <b>'+qty(auto)+' L</b>':'')+'.';
      } else {
        info.innerHTML='First report for this vessel. Last recorded figure was <b>'+qty(auto)+' L</b>'+esc(bunkNote)+'.';
      }
    }
    var cc=FuelLog.calc(d);
    var consumedNote = (cc.usedMain&&cc.usedAux)
      ? ' <span style="color:#5d7480;font-size:12px">(main '+qty(cc.usedMain)+' L + auxiliary '+qty(cc.usedAux)+' L)</span>' : '';
    var bl=b.list||[];
    var bunkerLine = bl.length
      ? bl.map(function(x){ return esc(x.refNo||"")+" \u00B7 "+esc(dmy(x.date))+(x.time?" "+esc(hhmm(x.time)):"")+" \u00B7 "+qty(x.litres)+" L "+esc(x.grade||"")+(x.bdn?" \u00B7 BDN "+esc(x.bdn):"")+(x.port?" \u00B7 "+esc(x.port):""); }).join("<br>")
      : '<span style="color:#5d7480">No bunkering falls between the previous report and this one.</span>';
    var openNote = b.bunkerings? ' <span class="pill p-info">includes '+b.bunkerings+' bunkering'+(b.bunkerings===1?"":"s")+'</span>' : '';
    var rowsHTML=
      '<div class="tw"><table class="grid" style="min-width:420px"><tbody>'+
      '<tr><td>Opening ROB'+openNote+'</td><td style="text-align:right">'+(b.opening===null?"—":qty(b.opening)+" L")+'</td></tr>'+
      '<tr><td>Less fuel consumed'+consumedNote+'</td><td style="text-align:right;color:#b3261e">'+(b.consumed?"\u2212"+qty(b.consumed)+" L":"0 L")+'</td></tr>'+
      '<tr style="background:#eaf1f4;font-weight:700"><td>Closing ROB</td><td style="text-align:right">'+(b.calculated===null?"—":qty(b.calculated)+" L")+'</td></tr>'+
      '<tr><td>ROB by sounding</td><td style="text-align:right">'+(b.sounded===null?"not taken":qty(b.sounded)+" L")+'</td></tr>'+
      '<tr><td>Difference</td><td style="text-align:right">'+FuelLog.robPill(b)+'</td></tr>'+
      '</tbody></table></div>'+
      '<div style="margin-top:8px;font-size:12.5px;color:#5d7480"><b>Bunkering already folded into the opening ROB above:</b><br>'+bunkerLine+
      ' <button type="button" class="btn sm g" style="margin-top:6px" onclick="FuelLog.addBunkerFrom()">Record a bunkering</button></div>';
    if(b.flag){
      rowsHTML+='<div style="background:#fbe4e2;border:1px solid #f0bdb8;border-radius:6px;padding:10px 12px;font-size:13px;color:#7a1a15;margin-top:10px">'+
        '<b>ROB does not balance</b><br>The sounding differs from the calculated figure by '+qty(Math.abs(b.diff))+' L, beyond the '+qty(b.allow)+' L allowance. '+
        'Check for an unrecorded bunkering, a missed daily entry, or a sounding error before saving.</div>';
    }
    box.innerHTML=rowsHTML;
  },

  resetOpening:function(){ FuelLog._openManual=false; FuelLog.live(); },

  addBunkerFrom:function(){
    UI.confirm("Leave this entry and open the bunkering register? Anything not yet saved here will be lost.").then(function(ok){
      if(!ok) return;
      App.go("fuel","bunkers");
      setTimeout(function(){ Register.form("bunkers"); },120);
    });
  },

  save:function(id){
    var d=FuelLog.read();
    var date=document.getElementById("fl_date").value;
    if(!d.vessel||!date) return UI.alert("Vessel and date are both required.");
    if(!d.rows.length) return UI.alert("This vessel has no engines registered. Add them in the engine register first.");
    var any=d.rows.some(function(r){ return num(r.used)>0||num(r.seaHrs)>0||num(r.portHrs)>0; });
    if(!any) return UI.alert("Enter the hours run and fuel consumed for at least one engine.");
    var rec = id? byId(DB.fuellog,id) : {id:uid(),created:new Date().toISOString()};
    if(!rec.created) rec.created=new Date().toISOString();
    rec.vessel=d.vessel; rec.date=date; rec.rows=d.rows;
    rec.time=hhmm(document.getElementById("fl_time").value)||"1200";
    rec.reportType=document.getElementById("fl_type").value;
    rec.voyage=document.getElementById("fl_voyage").value;
    var openVal=document.getElementById("fl_open").value;
    var auto=FuelLog.openingAuto({vessel:d.vessel,date:date,time:rec.time,id:id||null,created:rec.created});
    /* store the figure only when it differs from the ledger's own suggestion, so a later
       correction to an earlier report or a bunkering still flows through to this entry */
    rec.openingROB = (auto!==null && String(openVal).trim()!=="" &&
                      Math.abs(num(openVal)-auto)<0.001) ? "" : openVal;
    rec.robEnd=document.getElementById("fl_rob").value;
    rec.remarks=document.getElementById("fl_remarks").value;
    rec.updated=new Date().toISOString();
    if(!id){ rec.refNo=seq("fuellog","FL-",5); DB.fuellog.push(rec); }
    save(); FuelLog._editing=null; UI.close(); App.render();
    var c=FuelLog.calc(rec), b=FuelLog.balance(rec);
    UI.toast(c.flags? "Saved — consumption flagged as out of range"
           : (b.flag? "Saved — ROB does not balance" : "Daily entry saved"));
  },

  del:function(id){
    var r=byId(DB.fuellog,id);
    UI.confirm("Delete daily entry "+(r.refNo||"")+" for "+vesselName(r.vessel)+"? This cannot be undone.").then(function(ok){
      if(!ok) return;
      DB.fuellog=DB.fuellog.filter(function(x){return x.id!==id;});
      save(); App.render(); UI.toast("Entry deleted");

  },

         '<td>'+(x.pct===null?'—':pill((x.pct>0?"+":"")+x.pct.toFixed(1)+"%", x.state==="off"?"bad":(Math.abs(x.pct)>5?"warn":"ok")))+'</td></tr>';

    h+='<div class="fsec" style="margin:14px 0 8px">Fuel remaining on board</div><div class="tw"><table class="grid" style="min-width:420px"><tbody>'+

      '<tr><td>Less fuel consumed'+((c.usedMain&&c.usedAux)?' <span style="color:#5d7480;font-size:12px">(main '+qty(c.usedMain)+' L + auxiliary '+qty(c.usedAux)+' L)</span>':'')+'</td><td style="text-align:right">'+(b.consumed?"\u2212"+qty(b.consumed)+" L":"0 L")+'</td></tr>'+

    UI.open("Daily fuel entry", h,

  },

  flagged:function(){
    return (DB.fuellog||[]).filter(function(r){ return FuelLog.calc(r).flags>0; });
  },

  varianceView:function(){
    var logs=(DB.fuellog||[]);
    if(!logs.length) return '<div class="card"><div class="empty"><b>No daily entries yet</b>Encode daily consumption to build the variance report.</div></div>';
    var flagged=FuelLog.flagged();
    var tot={used:0,exp:0,hrs:0};
    logs.forEach(function(r){ var c=FuelLog.calc(r); tot.used+=c.used; tot.exp+=c.expected; tot.hrs+=c.hours; });
    var pct = tot.exp>0? ((tot.used-tot.exp)/tot.exp)*100 : 0;
    var h='<div class="kpis">'+
      '<div class="kpi money"><div class="n">'+qty(tot.used)+' L</div><div class="l">Reported consumption</div></div>'+
      '<div class="kpi money"><div class="n">'+qty(tot.exp)+' L</div><div class="l">Expected at declared rates</div></div>'+
      '<div class="kpi money '+(Math.abs(pct)>10?"danger":"")+'"><div class="n">'+(pct>0?"+":"")+pct.toFixed(1)+'%</div><div class="l">Fleet variance</div></div>'+
      kpi(flagged.length,"Entries out of range",flagged.length?"danger":"")+
      '</div>';
    /* per vessel per engine */
    var byE={};
    logs.forEach(function(r){
      var c=FuelLog.calc(r);
      c.rows.forEach(function(x){
        var k=r.vessel+"|"+x.unit;
        var o=byE[k]=byE[k]||{v:vesselName(r.vessel),tag:x.tag,used:0,exp:0,hrs:0,n:0,off:0};
        o.used+=x.used; o.exp+=x.expected; o.hrs+=x.hours; o.n++; if(x.state==="off") o.off++;
      });
    });
    var rows=Object.keys(byE).sort().map(function(k){
      var o=byE[k];
      var p = o.exp>0? ((o.used-o.exp)/o.exp)*100 : null;
      return [o.v,'<b>'+o.tag+'</b>',String(o.n),qty(o.hrs,1),qty(o.exp),qty(o.used),
              p===null?"—":pill((p>0?"+":"")+p.toFixed(1)+"%", Math.abs(p)>10?"bad":(Math.abs(p)>5?"warn":"ok")),
              o.off?pill(o.off+" flagged","bad"):"0",
              o.hrs?qty(o.used/o.hrs,1)+" L/h":"—"];
    });
    h+=tableCard("Variance by engine",["Vessel","Engine","Entries","Hours run","Expected (L)","Reported (L)","Variance","Out of range","Actual rate"],rows,
      '<button class="btn sm g" onclick="FuelLog.printVariance()">Print</button>');
    if(flagged.length){
      var fr=sortBy(flagged,"date",true).map(function(r){
        var c=FuelLog.calc(r);
        var worst=c.rows.filter(function(x){return x.state==="off";}).map(function(x){return x.tag+" "+(x.pct>0?"+":"")+x.pct.toFixed(1)+"%";}).join(", ");
        return [esc(r.refNo||""),esc(dmy(r.date)),esc(vesselName(r.vessel)),esc(worst),qty(c.expected),qty(c.used),
                '<button class="btn sm g" onclick="FuelLog.detail(\''+r.id+'\')">Open</button>'];
      });
      h+=tableCard("Entries needing verification",["Ref.","Date","Vessel","Engine variance","Expected (L)","Reported (L)",""],fr);
    }
    return h;
  },

    if(!logs.length) return UI.alert("No daily entries recorded yet.");

      return '<tr><td>'+esc(r.refNo||"")+'</td><td>'+esc(dmy(r.date))+'</td><td>'+esc(hhmm(r.time))+'</td><td>'+esc((r.reportType||"").split(" — ")[0])+'</td><td>'+esc(vesselName(r.vessel))+'</td>'+
        '<td style="text-align:right">'+qty(c.hours,1)+'</td><td style="text-align:right">'+qty(c.expected)+'</td>'+
        '<td style="text-align:right">'+qty(c.used)+'</td><td style="text-align:right">'+(c.pct===null?"—":(c.pct>0?"+":"")+c.pct.toFixed(1)+"%")+'</td>'+
        '<td style="text-align:right">'+(b.received?qty(b.received):"")+'</td>'+
        '<td style="text-align:right">'+(b.calculated===null?"":qty(b.calculated))+'</td>'+
        '<td style="text-align:right">'+(b.sounded===null?"":qty(b.sounded))+'</td>'+
        '<td>'+(c.flags?"CONSUMPTION OUT OF RANGE":(b.flag?"ROB DOES NOT BALANCE":"In order"))+'</td></tr>';

      '<table class="pgrid"><thead><tr><th>Ref.</th><th>Date</th><th>Time</th><th>Type</th><th>Vessel</th><th>Hours run</th><th>Expected (L)</th><th>Reported (L)</th><th>Variance</th><th>Bunkered (L)</th><th>ROB calc. (L)</th><th>ROB sounded (L)</th><th>Standing</th></tr></thead><tbody>'+rows+'</tbody></table>',true);
  },

  csv:function(){
    var logs=sortBy(DB.fuellog||[],"date",true);
    if(!logs.length) return UI.alert("There is nothing to export yet.");
    var lines=['"Ref.","Date","Time","Report type","Vessel","Voyage","Engine","Hours at sea","Hours in port","Rate at sea (L/h)","Rate in port (L/h)","Expected (L)","Reported (L)","Variance %","Standing","Opening ROB (L)","Bunkered (L)","Calculated ROB (L)","Sounded ROB (L)","ROB difference (L)","Remarks"'];
    logs.forEach(function(r){
      var c=FuelLog.calc(r), b=FuelLog.balance(r);
      c.rows.forEach(function(x){
        lines.push([r.refNo||"",r.date||"",hhmm(r.time),r.reportType||"",vesselName(r.vessel),r.voyage||"",x.tag,x.sea,x.port,x.rateSea,x.ratePort,
                    x.expected.toFixed(1),x.used,(x.pct===null?"":x.pct.toFixed(1)),
                    (x.state==="off"?"OUT OF RANGE":"In order"),
                    (b.opening===null?"":b.opening),b.received,(b.calculated===null?"":b.calculated.toFixed(1)),
                    (b.sounded===null?"":b.sounded),(b.diff===null?"":b.diff.toFixed(1)),r.remarks||""]
          .map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(","));
      });
    });
    var blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob), fn="NS-FLEET-fuel-log-"+today()+".csv";
    var a=document.createElement("a"); a.href=url; a.download=fn; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    UI.toast("CSV prepared: "+fn);
  },

  print:function(){ FuelLog.printVariance(); }
};

/* =====================================================================
   VOYAGE — elapsed time, steaming time, distance and speed
   ATD and ATA give the elapsed time. Less any stoppage, that is the
   steaming time. Distance and speed derive from each other: whichever
   the user is typing into drives the other.
   ===================================================================== */
var Voyage={
  _driver:"distance",
  driver:function(which){ Voyage._driver=which; },

  when:function(dateId,timeId){
    var d=(document.getElementById(dateId)||{value:""}).value;
    if(!d) return null;
    var t=hhmm((document.getElementById(timeId)||{value:""}).value)||"0000";
    var dt=new Date(d+"T"+t.slice(0,2)+":"+t.slice(2)+":00");
    return isNaN(dt)? null : dt;
  },

  calc:function(which){
    if(which) Voyage._driver=which;
    var el=function(i){ return document.getElementById(i); };
    var fElapsed=el("fld_elapsed"), fSteam=el("fld_steamHours"), fNote=el("fld_passageNote");
    if(!fElapsed||!fSteam) return;
    var a=Voyage.when("fld_atd","fld_atdTime"), b=Voyage.when("fld_ata","fld_ataTime");
    var elapsed=null, note="";
    if(a&&b){
      elapsed=(b-a)/3600000;
      if(elapsed<0){ note="Arrival is before departure — check the dates and times."; elapsed=null; }
    } else note="Enter both ATD and ATA to work out the passage.";
    fElapsed.value = elapsed===null? "" : elapsed.toFixed(2);

    var stop=num((el("fld_stopHours")||{value:""}).value);
    var steam = elapsed===null? null : Math.max(0, elapsed-stop);
    if(elapsed!==null && stop>elapsed) note="Stoppage is longer than the elapsed time — check the figures.";
    fSteam.value = steam===null? "" : steam.toFixed(2);

    var fd=el("fld_distance"), fs=el("fld_speed");
    if(fd&&fs&&steam!==null&&steam>0){
      if(Voyage._driver==="speed" && num(fs.value)>0){
        fd.value=(num(fs.value)*steam).toFixed(1);
      } else if(num(fd.value)>0){
        fs.value=(num(fd.value)/steam).toFixed(2);
      }
      var sp=num(fs.value);
      if(sp>0 && !note){
        note = qty(num(fd.value),1)+" NM in "+steam.toFixed(2)+" hrs at "+sp.toFixed(2)+" knots";
        if(sp>30) note+=" — check, that speed looks high";
      }
    }
    if(fNote) fNote.value=note;

    var consumption=function(depId,arrId,consumedId,avgId,perDay){
      var fDep=el(depId), fArr=el(arrId), fCons=el(consumedId), fAvg=el(avgId);
      if(!fDep||!fArr||!fCons) return;
      var depV=String(fDep.value||"").trim(), arrV=String(fArr.value||"").trim();
      var consumed = (depV!==""&&arrV!=="")? num(fDep.value)-num(fArr.value) : null;
      fCons.value = consumed===null? "" : consumed.toFixed(2);
      if(fAvg){
        var basis = steam===null? null : (perDay? steam/24 : steam);
        var avg = (consumed!==null && basis>0)? consumed/basis : null;
        fAvg.value = avg===null? "" : avg.toFixed(2);
      }
    };
    consumption("fld_fuelRobDep","fld_fuelRobArr","fld_fuelConsumed","fld_fuelAvgCons",false);
    consumption("fld_fwRobDep","fld_fwRobArr","fld_fwConsumed","fld_fwAvgCons",true);
    consumption("fld_loRobDep","fld_loRobArr","fld_loConsumed","fld_loAvgCons",true);
  }
};

/* =====================================================================
   PMS — works out the next-due date and running hours for a
   maintenance job from its interval, so the Master/engineer never
   types those in directly; only Standing (pmsStanding) reads them back.
   ===================================================================== */
var PMS={
  calc:function(){
    var el=function(i){ return document.getElementById(i); };
    var fDue=el("fld_dueDate"), fDueH=el("fld_dueHours");
    if(!fDue && !fDueH) return;
    if(fDue){
      var lastDone=(el("fld_lastDone")||{value:""}).value;
      var intervalDays=num((el("fld_intervalDays")||{value:""}).value);
      fDue.value="";
      if(lastDone && intervalDays>0){
        var dt=new Date(lastDone+"T00:00:00");
        if(!isNaN(dt)){ dt.setDate(dt.getDate()+Math.round(intervalDays)); fDue.value=dt.toISOString().slice(0,10); }
      }
    }
    if(fDueH){
      var lastHours=(el("fld_lastHours")||{value:""}).value;
      var intervalHours=num((el("fld_intervalHours")||{value:""}).value);
      fDueH.value = (lastHours!==""&&intervalHours>0)? (num(lastHours)+intervalHours) : "";
    }
  }
};

/* =====================================================================
   AUDIT — when the next one falls due
   The interval runs from the date of the audit. Only the most recent
   audit of each type, for each vessel or the office, can fall due.
   ===================================================================== */
var Audit={
  _manual:false,
  touch:function(){ Audit._manual=true; },

  open:function(){
    var nd=document.getElementById("fld_nextDue");
    Audit._manual = !!(nd && String(nd.value||"").trim()!=="");
    Audit.calc();
  },

  calc:function(){
    var nd=document.getElementById("fld_nextDue"); if(!nd||Audit._manual) return;
    var d=(document.getElementById("fld_date")||{value:""}).value;
    var m=num((document.getElementById("fld_intervalMonths")||{value:""}).value);
    if(!d||m<=0){ nd.value=""; return; }
    var dt=new Date(d+"T00:00:00");
    if(isNaN(dt)){ nd.value=""; return; }
    var day=dt.getDate();
    dt.setMonth(dt.getMonth()+Math.round(m));
    /* 31 January plus a month must not roll into March */
    if(dt.getDate()<day) dt.setDate(0);
    nd.value=dt.toISOString().slice(0,10);
  },

  /* the latest audit of each type for each vessel or the office */
  latest:function(){
    var byKey={};
    (DB.audits||[]).forEach(function(a){
      if(!a.nextDue) return;
      var k=(a.type||"")+"|"+(a.vessel||"office");
      if(!byKey[k] || String(a.date)>String(byKey[k].date)) byKey[k]=a;
    });
    return Object.keys(byKey).map(function(k){ return byKey[k]; });
  },

  dueList:function(){
    return Audit.latest().filter(function(a){ return days(a.nextDue)<=60; })
      .sort(function(x,y){ return days(x.nextDue)-days(y.nextDue); });
  }
};
