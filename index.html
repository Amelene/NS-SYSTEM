<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAVI CMS</title>
  <style>
    :root {
      --navy: #0f3b45;
      --teal: #146b78;
      --cream: #f6f4ef;
      --ink: #1d2a2e;
      --line: #dfe5df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f9f7f4 0%, #eef2f1 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }
    .box {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(15, 59, 69, 0.08);
    }
    .tag {
      display: inline-block;
      background: var(--navy);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: clamp(1.8rem, 3vw, 2.5rem);
    }
    p {
      margin: 0;
      color: #465b5d;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="tag">NAVI</div>
    <h1>CMS System</h1>
    <p>System is ready.</p>
  </div>
</body>
</html>
